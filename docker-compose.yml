services:
  whatsgo:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsgo:latest
    container_name: whatsgo
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - whatsgo_data:/app/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ─── Optional: PostgreSQL ──────────────────────────────────────────────────
  # Activate with: docker compose --profile postgres up
  # Set DATABASE_URL=postgres://whatsgo:whatsgo@postgres:5432/whatsgo?sslmode=disable
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    container_name: whatsgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsgo
      POSTGRES_PASSWORD: whatsgo
      POSTGRES_DB: whatsgo
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsgo"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Optional: MariaDB ────────────────────────────────────────────────────
  # Activate with: docker compose --profile mariadb up
  # Set DATABASE_URL=mysql://whatsgo:whatsgo@mariadb:3306/whatsgo
  mariadb:
    image: mariadb:11
    profiles: ["mariadb"]
    container_name: whatsgo-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: whatsgo
      MARIADB_DATABASE: whatsgo
      MARIADB_USER: whatsgo
      MARIADB_PASSWORD: whatsgo
    ports:
      - "3306:3306"
    volumes:
      - maria_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  whatsgo_data:
    driver: local
  pg_data:
    driver: local
  maria_data:
    driver: local
